# E09: compact volumetric arm. Designed for complementary ensemble signal, not raw capacity.
data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv
output_dir: runs/e09_small3d
seed: 2026
n_folds: 3
stream_mode: best
input_mode: 2d
backbone: 3d
target_attention: true
slice_pooling: attention
n_slices: 24
image_size: 160
batch_size: 2
pretrained: false
dropout: 0.25
lr: 0.0002
weight_decay: 0.0001
epochs: 15
patience: 4
calibrate_teacher: true
calibration_alpha: 5.0
min_calibration_studies: 8
gold_weight: 8.0
rank_loss_weight: 0.0
noise_std: 0.02
slice_dropout: 0.08
preflight_before_train: true
preflight_sample_size: 24
preflight_max_failure_rate: 0.05
strict_dicom: false
strict_dicom_inference: true
n_bootstrap: 2000
device: auto
precision: auto
num_workers: null
persistent_workers: true
prefetch_factor: 4
data_parallel: true
allow_test_report_fusion: false
