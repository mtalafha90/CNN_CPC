# Local workstation training. Point data_root at your competition data.
# For frozen experiment comparisons prefer configs/e01_... through e06_....
data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv
output_dir: runs/local

seed: 2026
n_folds: 3
stream_mode: best
input_mode: 2d
triplet_gap: 1
backbone: resnet18
target_attention: false
slice_pooling: attention
topk_fraction: 0.25

# Hardware
device: auto
precision: auto
num_workers: null
persistent_workers: true
prefetch_factor: 4
data_parallel: true

# Model / optimization
n_slices: 16
image_size: 224
batch_size: 8
pretrained: true
dropout: 0.25
lr: 0.0002
weight_decay: 0.0001
epochs: 15
patience: 4

# Supervision
calibrate_teacher: true
calibration_alpha: 5.0
min_calibration_studies: 8
gold_weight: 8.0
rank_loss_weight: 0.0
rank_pairs_per_target: 32

# Augmentation
noise_std: 0.02
slice_dropout: 0.08

# DICOM safety
preflight_before_train: true
preflight_sample_size: 24
preflight_max_failure_rate: 0.05
strict_dicom: false
strict_dicom_inference: true

# Evaluation / inference
n_bootstrap: 2000
allow_test_report_fusion: false
