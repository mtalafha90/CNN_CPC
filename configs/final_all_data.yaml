# Final production model after B17 development selection.
#
# Representation:
#   completed B16 report-aligned encoder trained on all 4,349 non-gold MRI/report pairs.
#
# Downstream:
#   freeze that encoder exactly as in B17;
#   train the unchanged B13/B16/B17 hierarchy/head on
#     - all 3,120 B6-active non-gold studies, plus
#     - all 58 expert-gold studies with true 0/1 labels at unit weight.
#
# The remaining 1,229 non-gold B6-inactive studies already contributed to the
# report-aligned representation stage and are not assigned invented pathology targets.
#
# This is a FINAL-PRODUCTION model. The 58-study gold surface is now consumed by
# training and must not be used again to estimate this model's performance.

data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv

seed: 2026
competition_mode: true
requested_gpus: 1
allow_external_pretrained: true
pretrained: true

device: auto
precision: auto
runtime_budget_hours: 8.5
runtime_reserve_minutes: 10

num_workers: null
persistent_workers: true
prefetch_factor: 2
multiprocessing_context: spawn
series_cache_mb_per_worker: 256
strict_dicom: false
strict_dicom_inference: true

# Unchanged B13/B16/B17 hierarchy / preprocessing.
b12_use_physical_scale: false
b12_1_series_pool_heads: 8
b7_n_slices: 16
b7_image_size: 224
b7_triplet_gap: 1
b7_batch_size: 2
b7_encoder_batch_size: 24
b7_gradient_checkpointing: true
b7_dropout: 0.25
b7_transformer_layers: 2
b7_transformer_heads: 8
b7_transformer_ff_mult: 2.0
b7_pathology_layers: 1

# Final downstream: 3,120 B6-active + 58 gold = 3,178 studies.
# Batch size 2 -> 1,589 exact batches/epoch.
b7_epochs: 5
b7_max_batches_per_epoch: 1589
b7_encoder_lr: 0.0
b7_head_lr: 0.0001
b7_min_lr: 0.000001
b7_weight_decay: 0.0001
b7_grad_clip: 1.0

# Frozen B6 v1.2.1 policy for non-gold cells.
b7_min_confidence: 0.75
b7_positive_target: 0.85
b7_negative_target: 0.05
b7_positive_weight: 0.50
b7_negative_weight: 1.00

# Final-production expert supervision.
final_include_gold: true
final_gold_weight: 1.0
final_encoder_frozen: true
final_additional_label_smoothing: 0.0
final_robust_loss: none

# Unchanged MRI augmentation.
b7_noise_std: 0.02
b7_slice_dropout: 0.08
b7_train_gap_choices: [1, 2]
b7_center_jitter: 2
b7_rotation_deg: 5.0
b7_translate_frac: 0.03
b7_scale_jitter: 0.05
b7_gamma_jitter: 0.12
b7_bias_field_strength: 0.08

# Frozen inference contract.
b7_eval_tta_offsets: [-1, 0, 1]
b7_eval_batch_size: 2
b7_n_bootstrap: 5000
