# E08: DINOv2 ViT-S/14 representation through timm.
# Verify current competition rules for external/pretrained weights before running.
# The official timm model config is fixed at 518x518 input.
data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv
output_dir: runs/e08_dinov2_timm
seed: 2026
n_folds: 3
stream_mode: dual
input_mode: 2p5d
triplet_gap: 1
backbone: timm:vit_small_patch14_dinov2.lvd142m
target_attention: true
slice_pooling: attention
topk_fraction: 0.25
n_slices: 6
image_size: 518
batch_size: 1
pretrained: true
dropout: 0.25
lr: 0.00005
weight_decay: 0.0001
epochs: 12
patience: 4
calibrate_teacher: true
calibration_alpha: 5.0
min_calibration_studies: 8
gold_weight: 8.0
rank_loss_weight: 0.0
noise_std: 0.02
slice_dropout: 0.08
preflight_before_train: true
preflight_sample_size: 24
preflight_max_failure_rate: 0.05
strict_dicom: false
strict_dicom_inference: true
n_bootstrap: 2000
device: auto
precision: auto
num_workers: null
persistent_workers: true
prefetch_factor: 2
data_parallel: true
allow_test_report_fusion: false
