# B14 ImageNet full slice-token aggregation.
#
# Single scientific change vs B13:
#   B13: 16 slice tokens / real MRI series -> one learned series token
#   B14: retain every K x 16 slice token through the study Transformer
#
# ImageNet protocol, data surface, optimizer, augmentation, four epochs and TTA
# are frozen to B13.

data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv

seed: 2026
competition_mode: true
requested_gpus: 1

# Same external encoder protocol as B13.
allow_external_pretrained: true
pretrained: true

# Dedicated B14 identity and frozen aggregation.
b14_experiment_name: B14_imagenet_full_slice_tokens
b14_aggregation: all_real_series_x_16_slice_tokens_v1

device: auto
precision: auto
runtime_budget_hours: 8.5
runtime_reserve_minutes: 10

# Preserve B13/B12 series and preprocessing controls.
b12_use_physical_scale: false
# Retained only for config parity with B13; B14 does not instantiate series pooling.
b12_1_series_pool_heads: 8

# Loader/runtime, unchanged from B13.
num_workers: null
persistent_workers: true
prefetch_factor: 2
multiprocessing_context: spawn
series_cache_mb_per_worker: 256
strict_dicom: false
strict_dicom_inference: true

# Image/model settings, unchanged from B13.
b7_n_slices: 16
b7_image_size: 224
b7_triplet_gap: 1
b7_batch_size: 2
b7_encoder_batch_size: 24
b7_gradient_checkpointing: true
b7_dropout: 0.25
b7_transformer_layers: 2
b7_transformer_heads: 8
b7_transformer_ff_mult: 2.0
b7_pathology_layers: 1

# Optimization, unchanged from B13.
b7_epochs: 4
b7_max_batches_per_epoch: 1560
b7_encoder_lr: 0.00001
b7_head_lr: 0.0001
b7_min_lr: 0.000001
b7_weight_decay: 0.0001
b7_grad_clip: 1.0

# Frozen B6 v1.2.1 supervision, unchanged.
b7_min_confidence: 0.75
b7_positive_target: 0.85
b7_negative_target: 0.05
b7_positive_weight: 0.50
b7_negative_weight: 1.00

# MRI augmentation, unchanged from B13.
b7_noise_std: 0.02
b7_slice_dropout: 0.08
b7_train_gap_choices: [1, 2]
b7_center_jitter: 2
b7_rotation_deg: 5.0
b7_translate_frac: 0.03
b7_scale_jitter: 0.05
b7_gamma_jitter: 0.12
b7_bias_field_strength: 0.08

# Frozen gold development evaluation.
b7_eval_tta_offsets: [-1, 0, 1]
b7_eval_batch_size: 2
b7_n_bootstrap: 5000
