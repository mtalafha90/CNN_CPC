# B23 LLM report-labelling and large development split.
#
# B23 changes the SUPERVISION SOURCE and the DEVELOPMENT SURFACE. It does not
# change any training recipe, architecture, resolution or crop policy. Those
# remain exactly as B20 left them so that a later comparison attributes any
# movement to the labels rather than to the model.
#
# B6 v1.2.1 stays frozen. This is a separately versioned alternative export,
# not a replacement of the historical supervision used by B7-B22.

data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv

seed: 2026
competition_mode: true
requested_gpus: 1

# --- Labeller ----------------------------------------------------------------
# Competition reproducibility requires an identifiable, re-runnable labelling
# function, so B23 uses an openly downloadable checkpoint executed locally and
# pinned to an exact hub revision. A hosted API cannot satisfy this: the weights
# behind a model name can change without notice.
#
# Qwen2.5 is Apache-2.0 with no acceptance gate, and is strong on the Spanish,
# Dutch and Turkish this corpus contains. Raise the size first if the labeller
# audit is marginal.
# Sized for a 16 GB laptop card (RTX A4500 Laptop). Qwen3-14B at Q4_K_M is
# ~9.3 GB, leaving ~6.7 GB for the KV cache at num_ctx 8192. Drop to qwen3:8b
# (~5.2 GB) on a smaller card.
b23_backend: ollama                  # ollama | local_transformers | local_vllm
b23_model: qwen3:14b
b23_ollama_host: http://localhost:11434
b23_dtype: gguf
b23_quantisation: Q4_K_M             # reported by the daemon, recorded in provenance
b23_max_new_tokens: 2048
b23_decoding: greedy                 # temperature 0, top_k 0; no RNG dependence
b23_think: false                     # Qwen3 reasoning mode off for extraction
b23_max_attempts: 3
b23_require_reproducible: true       # refuse to certify an unpinned export

# Ollama defaults to a small context window and TRUNCATES silently past it. The
# system prompt is ~5.9k characters and the longest sampled report ~2.1k, so a
# default window would cut the report in half and corrupt labels invisibly.
# The backend estimates prompt length and refuses rather than truncating.
b23_num_ctx: 8192

# Frozen B6-compatible supervision policy. The downstream B7 family reads these
# exact semantics, so keeping them identical is what makes B23 a drop-in
# supervision swap rather than a new training recipe.
b7_min_confidence: 0.75
b7_positive_target: 0.85
b7_negative_target: 0.05
b7_positive_weight: 0.50
b7_negative_weight: 1.00

# Report silence is not a negative label. B23 keeps uncertain/unmentioned
# ignored by pinning their confidence to zero, exactly as B6 does. Recovering
# them is a separate, separately versioned hypothesis.
b23_unmentioned_is_negative: false

# --- Development split -------------------------------------------------------
# Sized to make near-neighbour model comparisons measurable. At n=58 the macro
# AUC standard error is about 0.0250; B22 measured a 0.0439 within-run swing on
# that surface, which is larger than the entire B13->B20 campaign gain.
b23_holdout_fraction: 0.20
b23_holdout_seed: 2026
b23_holdout_min_class_count: 8
b23_holdout_search_candidates: 4096
