# Single production configuration. Change data_root/output_dir for your machine.
data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv
output_dir: runs/model
seed: 2026
n_folds: 3

# MRI/model: ConvNeXt slice encoder + cross-sequence Transformer + 12 pathology queries.
n_slices: 16
image_size: 224
triplet_gap: 1
batch_size: 2
encoder_batch_size: 24
gradient_checkpointing: true
pretrained: true
normalize_input: true
dropout: 0.25
transformer_layers: 2
transformer_heads: 8
transformer_ff_mult: 2.0
pathology_layers: 1

# In-domain SSL. Recommended first stage:
#   rsna-knee pretrain --config configs/train.yaml
# then set ssl_encoder_checkpoint: runs/ssl/ssl_encoder.pt
ssl_encoder_checkpoint: null
ssl_output_dir: runs/ssl
ssl_epochs: 10
ssl_batch_size: 4
ssl_n_slices: 5
ssl_projection_dim: 256
ssl_temperature: 0.15
ssl_metadata_weight: 0.25
ssl_lr: 0.0002
ssl_weight_decay: 0.0001
ssl_noise_std: 0.01

# Optimization
lr: 0.0001
min_lr: 0.000001
weight_decay: 0.0001
epochs: 20
patience: 5
grad_clip: 1.0

# Weak supervision / PU
calibrate_teacher: true
calibration_alpha: 5.0
min_calibration_studies: 8
gold_weight: 8.0
unmentioned_weight: 0.0
uncertain_weight_cap: 0.10
rank_loss_weight: 0.10
rank_pairs_per_target: 32
rank_min_confidence: 0.35
rank_positive_threshold: 0.75
rank_negative_threshold: 0.25

# Cross-fitted image/report co-training.
# Stage 1: leave null and train all folds. Each fold writes weak_oof.csv.
# Stage 2: set this to the three stage-1 weak_oof.csv files, change output_dir,
# and retrain all folds. Agreement strengthens supervision; disagreement is weak.
cotrain_image_oof: null
cotrain_positive_threshold: 0.80
cotrain_negative_threshold: 0.20
cotrain_agreement_weight: 0.90
cotrain_disagreement_weight: 0.05
cotrain_blend: 0.50

# Balanced study sampling
trusted_fraction: 0.30
trusted_pseudo_threshold: 0.60

# MRI-specific training augmentation
noise_std: 0.02
slice_dropout: 0.08
train_gap_choices: [1, 2]
center_jitter: 2
rotation_deg: 5.0
translate_frac: 0.03
scale_jitter: 0.05
gamma_jitter: 0.12
bias_field_strength: 0.08

# Deterministic inference TTA over slice-center offsets.
tta_center_offsets: [-1, 0, 1]

# DICOM safety
preflight_before_train: true
preflight_sample_size: 24
preflight_max_decode_failure_rate: 0.05
strict_dicom: false
strict_dicom_inference: true

# Evaluation
n_bootstrap: 2000

# Runtime / DDP
# torchrun --standalone --nproc_per_node=<N> -m rsna_knee.cli train --config configs/train.yaml --fold 0
device: auto
precision: auto
ddp_backend: nccl
num_workers: null
persistent_workers: true
prefetch_factor: 4
