# Single production configuration. Change data_root/output_dir for your machine.
data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv
output_dir: runs/model

seed: 2026
n_folds: 3

# Fixed MRI/model path: dual-sequence 2.5D + hierarchical ConvNeXt-Tiny MIL.
n_slices: 16
image_size: 224
triplet_gap: 1
batch_size: 2
encoder_batch_size: 24
gradient_checkpointing: true
pretrained: true
normalize_input: true
dropout: 0.25

# Optimization
lr: 0.0001
min_lr: 0.000001
weight_decay: 0.0001
epochs: 20
patience: 5
grad_clip: 1.0

# Weak supervision
calibrate_teacher: true
calibration_alpha: 5.0
min_calibration_studies: 8
gold_weight: 8.0
rank_loss_weight: 0.10
rank_pairs_per_target: 32
rank_min_confidence: 0.35
rank_positive_threshold: 0.75
rank_negative_threshold: 0.25

# MRI augmentation
noise_std: 0.02
slice_dropout: 0.08

# DICOM safety
preflight_before_train: true
preflight_sample_size: 24
preflight_max_decode_failure_rate: 0.05
strict_dicom: false
strict_dicom_inference: true

# Evaluation
n_bootstrap: 2000

# Runtime. Proper multi-GPU DDP is intentionally the next development step.
device: auto
precision: auto
num_workers: null
persistent_workers: true
prefetch_factor: 4
