# B16 full-report semantic representation experiment.
#
# Representation:
#   ImageNet ConvNeXt-Tiny -> completed B15 knee-MRI SSL
#   -> full competition-report TF-IDF/SVD semantic alignment.
#
# Downstream:
#   unchanged B13 hierarchical one-token-per-series model
#   -> frozen B6 v1.2.1 positive/negated supervision
#   -> full 3,120-study / 17,475-series surface.
#
# Weak-v2 is NOT a B16 model-selection gate.

data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv

seed: 2026
competition_mode: true
requested_gpus: 1
allow_external_pretrained: true
pretrained: true

device: auto
precision: auto
runtime_budget_hours: 8.5
runtime_reserve_minutes: 10

num_workers: null
persistent_workers: true
prefetch_factor: 2
multiprocessing_context: spawn
series_cache_mb_per_worker: 256
strict_dicom: false
strict_dicom_inference: true

# Frozen B13 downstream hierarchy / preprocessing.
b12_use_physical_scale: false
b12_1_series_pool_heads: 8
b7_n_slices: 16
b7_image_size: 224
b7_triplet_gap: 1
b7_batch_size: 2
b7_encoder_batch_size: 24
b7_gradient_checkpointing: true
b7_dropout: 0.25
b7_transformer_layers: 2
b7_transformer_heads: 8
b7_transformer_ff_mult: 2.0
b7_pathology_layers: 1

# Full 3,120-study downstream B6 surface.
b7_epochs: 4
b7_max_batches_per_epoch: 1560
b7_encoder_lr: 0.00001
b7_head_lr: 0.0001
b7_min_lr: 0.000001
b7_weight_decay: 0.0001
b7_grad_clip: 1.0

# Frozen B6 v1.2.1 policy.
b7_min_confidence: 0.75
b7_positive_target: 0.85
b7_negative_target: 0.05
b7_positive_weight: 0.50
b7_negative_weight: 1.00

# Frozen downstream MRI augmentation.
b7_noise_std: 0.02
b7_slice_dropout: 0.08
b7_train_gap_choices: [1, 2]
b7_center_jitter: 2
b7_rotation_deg: 5.0
b7_translate_frac: 0.03
b7_scale_jitter: 0.05
b7_gamma_jitter: 0.12
b7_bias_field_strength: 0.08

# Frozen gold evaluation.
b7_eval_tta_offsets: [-1, 0, 1]
b7_eval_batch_size: 2
b7_n_bootstrap: 5000

# B16 full-report alignment protocol.
# Text semantics reuse the established competition-only B5 TF-IDF/SVD recipe;
# no external language model is introduced.
b16_report_n_slices: 5
b16_report_positions_per_series: 2
b16_report_batch_size: 2
b16_report_epochs: 4
b16_report_dim: 256
b16_tfidf_max_features: 20000
b16_tfidf_min_df: 2
b16_report_queue_size: 256
b16_report_encoder_lr: 0.00005
b16_report_head_lr: 0.0002
b16_report_min_lr: 0.000001
b16_report_weight_decay: 0.0001
b16_report_temperature: 0.10
b16_report_cosine_weight: 0.25
b16_report_grad_clip: 1.0
