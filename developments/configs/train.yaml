# Production configuration for the 2026 RSNA Knee Abnormality Detection challenge.
# Machine-specific paths should be the only mandatory edits.
data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv
test_csv: test.csv
test_series_csv: test_series.csv
output_dir: runs/model
seed: 2026
n_folds: 3

# Conservative competition policy.
competition_mode: true
requested_gpus: 1
runtime_budget_hours: 8.5
runtime_reserve_minutes: 10
submission_filename: submission.csv
allow_external_pretrained: false
pretrained: false
expected_checkpoint_stage: null

# MRI/model: ConvNeXt slice encoder + cross-sequence Transformer + 12 pathology queries.
n_slices: 16
image_size: 224
triplet_gap: 1
batch_size: 2
inference_batch_size: 2
oof_batch_size: 2
weak_oof_batch_size: 2
encoder_batch_size: 24
gradient_checkpointing: true
normalize_input: false
dropout: 0.25
transformer_layers: 2
transformer_heads: 8
transformer_ff_mult: 2.0
pathology_layers: 1

# In-domain SSL. Run this in a separate <=8.5 h notebook/job. If attached,
# declare exactly where the checkpoint came from.
ssl_encoder_checkpoint: null
ssl_checkpoint_source: null
ssl_output_dir: runs/ssl
ssl_epochs: 4
ssl_max_batches_per_epoch: 300
ssl_batch_size: 4
ssl_n_slices: 5
ssl_projection_dim: 256
ssl_temperature: 0.15
ssl_metadata_weight: 0.25
ssl_lr: 0.0002
ssl_weight_decay: 0.0001
ssl_noise_std: 0.01

# Nested optimization. Epochs are bounded by batch count as well as wall time.
lr: 0.0001
min_lr: 0.000001
weight_decay: 0.0001
epochs: 8
max_train_batches_per_epoch: 300
patience: 2
grad_clip: 1.0

# The remaining-work estimator reserves measured time for the full finish path:
# Phase-B -> outer OOF -> Stage-1 weak OOF -> bootstrap -> serialization.
finish_inference_safety_factor: 1.75
finish_seconds_per_study_floor: 0.25
finish_seconds_per_study_fallback: 5.0
finish_bootstrap_reserve_seconds: 120
finish_serialization_reserve_seconds: 180
finish_loader_startup_reserve_seconds: 120
prediction_initial_batch_guard_seconds: 180

# Weak supervision / PU.
calibrate_teacher: true
calibration_alpha: 5.0
min_calibration_studies: 8
gold_weight: 8.0
unmentioned_weight: 0.0
uncertain_weight_cap: 0.10
rank_loss_weight: 0.10
rank_pairs_per_target: 32
rank_min_confidence: 0.35
rank_positive_threshold: 0.75
rank_negative_threshold: 0.25

# Leakage-safe Stage 2.
# Stage 1: leave both source fields null.
# Stage 2 with one frozen Stage-1 method: set cotrain_stage1_root.
# Stage 2 with candidate methods (recommended for random-vs-SSL): set
# cotrain_stage1_candidates to both roots. Fold k is selected using ONLY that
# fold's inner_macro_auc; outer OOF scores are never used for the choice.
cotrain_stage1_root: null
cotrain_stage1_candidates: null
cotrain_positive_threshold: 0.80
cotrain_negative_threshold: 0.20
cotrain_agreement_weight: 0.90
cotrain_disagreement_weight: 0.05
cotrain_blend: 0.50
cotrain_report_low_confidence: 0.10
cotrain_image_only_positive_threshold: 0.95
cotrain_image_only_negative_threshold: 0.05
cotrain_image_only_weight: 0.20
cotrain_image_only_blend: 0.75

# Balanced study sampling.
trusted_fraction: 0.30
trusted_pseudo_threshold: 0.60

# MRI-specific training augmentation.
noise_std: 0.02
slice_dropout: 0.08
train_gap_choices: [1, 2]
center_jitter: 2
rotation_deg: 5.0
translate_frac: 0.03
scale_jitter: 0.05
gamma_jitter: 0.12
bias_field_strength: 0.08

# Validation and submission use the SAME TTA policy. This is deliberate: epoch
# selection and outer OOF measure the exact inference policy planned for submission.
tta_center_offsets: [-1, 0, 1]
validation_tta_offsets: [-1, 0, 1]
allow_validation_submission_tta_mismatch: false
# Weak OOF teachers are generated with one center view to protect the <9 h budget.
weak_oof_tta_offsets: [0]
auto_tta_budget: true
allow_tta_fallback: true

# DICOM safety / cache.
preflight_before_train: true
preflight_sample_size: 24
preflight_max_decode_failure_rate: 0.05
preflight_max_file_decode_failure_rate: 0.05
strict_dicom: false
strict_dicom_inference: true
series_cache_mb_per_worker: 256

# Full audit uses CPU processes in a separate run. The global file-failure rate
# and any individual series with substantial partial corruption are hard gates.
audit_workers: 4
audit_max_global_file_decode_failure_rate: 0.02
audit_max_series_file_decode_failure_rate: 0.20

# Evaluation.
n_bootstrap: 2000

# One GPU + CPU multiprocessing. Never launch with torchrun.
device: auto
precision: auto
num_workers: null
persistent_workers: true
prefetch_factor: 2
multiprocessing_context: spawn
