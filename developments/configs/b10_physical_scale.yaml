# B10-v1: physical-scale normalization ablation against B7.1.
#
# Single scientific change:
#   native MRI pixels
#     -> plane-specific canonical in-plane PixelSpacing
#     -> canonical physical FOV by center crop/pad
#     -> unchanged 224x224 network resize
#
# Canonical spacing/FOV are NOT specified by hand and are NOT chosen from gold AUC.
# Run rsna-knee-b10-audit first. It derives medians from the exact 3,120 active
# B6 weak-training studies under historical B7.1 dual routing and writes a frozen
# physical_scale_policy.json. Training refuses a policy whose selected-series
# signature differs from the current B7.1 routing.

data_root: /data/rsna-knee-abnormality-detection
train_csv: train.csv
train_series_csv: train_series.csv

seed: 2026
competition_mode: true
requested_gpus: 1
allow_external_pretrained: false
pretrained: false
device: auto
precision: auto
runtime_budget_hours: 8.5
runtime_reserve_minutes: 10

b10_experiment_name: B10_physical_scale_normalization
b10_physical_policy: inplane_median_spacing_fov_v1
b10_min_geometry_coverage: 0.95
b10_missing_spacing_action: legacy_resize

num_workers: null
persistent_workers: true
prefetch_factor: 2
multiprocessing_context: spawn
series_cache_mb_per_worker: 256
strict_dicom: false
strict_dicom_inference: true

# B7.1 model contract: unchanged.
b7_n_slices: 16
b7_image_size: 224
b7_triplet_gap: 1
b7_batch_size: 2
b7_encoder_batch_size: 24
b7_gradient_checkpointing: true
b7_dropout: 0.25
b7_transformer_layers: 2
b7_transformer_heads: 8
b7_transformer_ff_mult: 2.0
b7_pathology_layers: 1

# B7.1 optimization contract: unchanged.
b7_epochs: 4
b7_max_batches_per_epoch: 1560
b7_encoder_lr: 0.00001
b7_head_lr: 0.0001
b7_min_lr: 0.000001
b7_weight_decay: 0.0001
b7_grad_clip: 1.0

# Frozen B6 supervision: unchanged.
b7_min_confidence: 0.75
b7_positive_target: 0.85
b7_negative_target: 0.05
b7_positive_weight: 0.50
b7_negative_weight: 1.00

# MRI augmentation: unchanged.
b7_noise_std: 0.02
b7_slice_dropout: 0.08
b7_train_gap_choices: [1, 2]
b7_center_jitter: 2
b7_rotation_deg: 5.0
b7_translate_frac: 0.03
b7_scale_jitter: 0.05
b7_gamma_jitter: 0.12
b7_bias_field_strength: 0.08

# Frozen development evaluation.
b7_eval_tta_offsets: [-1, 0, 1]
b7_eval_batch_size: 2
b7_n_bootstrap: 5000
