name: materialize-external-validation

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize_external_validation.py
      - .github/workflows/materialize_external_validation.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/materialize_external_validation.py
      - .github/workflows/materialize_external_validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pillow pydicom
      - name: Download four open-license knee MRI images and build DICOM fixture
        env:
          PYTHONPATH: src
        run: |
          python scripts/materialize_external_validation.py \
            --output fixtures/external_validation \
            --overwrite
      - name: Commit materialized validation fixture
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fixtures/external_validation
          if git diff --cached --quiet; then
            echo "Validation fixture already up to date."
            exit 0
          fi
          git commit -m "Materialize four-image external knee MRI validation fixture"
          git push origin "HEAD:${TARGET_BRANCH}"
