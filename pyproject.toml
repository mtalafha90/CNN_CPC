[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-cnn-cpc"
version = "0.30.0"
description = "Clean training, validation and test interface for the current CNN-based RSNA knee MRI model"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "timm>=1.0.20",
]

[project.scripts]
cnn-train = "training.train:main"
cnn-validate = "validation.validate:main"
cnn-test = "testing.test:main"
cnn-model-info = "model.architecture:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "data*", "training*", "validation*", "testing*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = [".", "developments/src"]
testpaths = ["tests", "developments/tests"]
addopts = "-ra"
