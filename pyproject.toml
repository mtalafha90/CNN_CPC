[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-cnn-cpc"
version = "0.29.0"
description = "One-GPU nested-validation weakly supervised knee MRI pipeline for the 2026 RSNA AI Challenge"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "matplotlib>=3.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# Only the B23 report-labelling step needs an LLM client. Everything else --
# including the B23 labeller audit and the frozen development split -- runs
# from the exported CSVs with no network access.
llm = ["anthropic>=0.40"]

[project.scripts]
rsna-knee = "rsna_knee.cli:main"
rsna-knee-report-teacher = "rsna_knee.report_teacher_cli:main"
