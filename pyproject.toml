[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-cnn-cpc"
version = "0.1.0"
description = "Multimodal/semi-supervised baseline for the 2026 RSNA Knee MRI AI Challenge"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
rsna-knee = "rsna_knee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
