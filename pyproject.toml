[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-cnn-cpc"
version = "0.11.1"
description = "One-GPU nested-validation weakly supervised knee MRI pipeline for the 2026 RSNA AI Challenge"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
rsna-knee = "rsna_knee.cli:main"
rsna-knee-report-teacher = "rsna_knee.report_teacher_cli:main"
rsna-knee-b2 = "rsna_knee.discriminative_training:main"
rsna-knee-b3 = "rsna_knee.pathology_training:main"
rsna-knee-b4 = "rsna_knee.frozen_features:main"
rsna-knee-b4-shared = "rsna_knee.frozen_features_shared:main"
rsna-knee-b4-grouped = "rsna_knee.frozen_features_grouped:main"
rsna-knee-b4-crossval = "rsna_knee.frozen_features_crossval:main"
rsna-knee-b5 = "rsna_knee.report_ssl:main"
rsna-knee-b6 = "rsna_knee.b6_report_labels:main"
rsna-knee-b6-audit = "rsna_knee.b6_gold_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
