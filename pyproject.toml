[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-cnn-cpc"
version = "0.22.0"
description = "One-GPU nested-validation weakly supervised knee MRI pipeline for the 2026 RSNA AI Challenge"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
rsna-knee = "rsna_knee.cli:main"
rsna-knee-report-teacher = "rsna_knee.report_teacher_cli:main"
rsna-knee-b2 = "rsna_knee.discriminative_training:main"
rsna-knee-b3 = "rsna_knee.pathology_training:main"
rsna-knee-b4 = "rsna_knee.frozen_features:main"
rsna-knee-b4-shared = "rsna_knee.frozen_features_shared:main"
rsna-knee-b4-grouped = "rsna_knee.frozen_features_grouped:main"
rsna-knee-b4-crossval = "rsna_knee.frozen_features_crossval:main"
rsna-knee-b5 = "rsna_knee.report_ssl:main"
rsna-knee-b6 = "rsna_knee.b6_report_labels:main"
rsna-knee-b6-audit = "rsna_knee.b6_gold_audit:main"
rsna-knee-b7 = "rsna_knee.b7_weak_supervision:main"
rsna-knee-b7-eval = "rsna_knee.b7_gold_eval:main"
rsna-knee-b8 = "rsna_knee.b8_anatomy_spatial:main"
rsna-knee-b8-eval = "rsna_knee.b8_gold_eval:main"
rsna-knee-b9 = "rsna_knee.b9_strict_routing:main"
rsna-knee-b9-eval = "rsna_knee.b9_gold_eval:main"
rsna-knee-b10-audit = "rsna_knee.b10_spacing_audit:main"
rsna-knee-b10 = "rsna_knee.b10_physical_scale:main"
rsna-knee-b10-eval = "rsna_knee.b10_gold_eval:main"
rsna-knee-b11-pseudo = "rsna_knee.b11_pseudo_labels:main"
rsna-knee-b11 = "rsna_knee.b11_teacher_student:main"
rsna-knee-b11-eval = "rsna_knee.b11_gold_eval:main"
rsna-knee-b11-1-pseudo = "rsna_knee.b11_1_quantile_pseudo:main"
rsna-knee-b11-1 = "rsna_knee.b11_1_teacher_student:main"
rsna-knee-b11-1-eval = "rsna_knee.b11_1_gold_eval:main"
rsna-knee-b12-audit = "rsna_knee.b12_series_audit:main"
rsna-knee-b12 = "rsna_knee.b12_training:main"
rsna-knee-b12-eval = "rsna_knee.b12_gold_eval:main"
rsna-knee-b12-1 = "rsna_knee.b12_1_training:main"
rsna-knee-b12-1-eval = "rsna_knee.b12_1_gold_eval:main"
rsna-knee-b13 = "rsna_knee.b13_training:main"
rsna-knee-b13-eval = "rsna_knee.b13_gold_eval:main"
rsna-knee-b14 = "rsna_knee.b14_training:main"
rsna-knee-b14-eval = "rsna_knee.b14_gold_eval:main"
rsna-knee-slice-audit = "rsna_knee.slice_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
