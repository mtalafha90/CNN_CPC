# Baseline configuration. Point the paths at your local copy of the data and
# everything else should work unchanged. Override any value on the command line
# with, for example: --set model.backbone=convnext_small train.epochs=15

paths:
  data_dir: data                       # holds train.csv, sample_submission.csv
  cache_dir: cache/train               # written by rsnaknee.preprocess
  output_dir: runs/baseline
  train_csv: null                      # null means "find it under data_dir"
  sample_submission_csv: null
  reports_csv: null                    # the multilingual radiology reports
  test_dicom_dir: null

data:
  image_size: 224
  depth: 24                            # slices sampled per series
  max_series: 5                        # series kept per exam
  n_folds: 5
  seed: 42
  augment: true
  horizontal_flip: false               # leave off: it swaps medial and lateral
  rotate_degrees: 10.0
  scale_jitter: 0.1
  intensity_jitter: 0.2
  noise_std: 0.01
  series_dropout: 0.1
  random_erase: 0.15
  num_workers: 8

model:
  backbone: convnext_tiny              # try tf_efficientnetv2_s or convnext_small
  pretrained: true
  embed_dim: 512
  slice_layers: 2
  slice_heads: 8
  dropout: 0.1
  drop_path: 0.1
  grad_checkpoint: false               # turn on if you run out of GPU memory

train:
  epochs: 12
  batch_size: 4                        # exams per step; each holds max_series volumes
  accumulate: 2                        # effective batch = batch_size * accumulate
  learning_rate: 0.0003
  backbone_lr_scale: 0.1
  weight_decay: 0.01
  warmup_epochs: 1.0
  amp_dtype: bf16                      # bf16 on Ampere or newer, else fp16
  ema_decay: 0.999
  clip_grad: 5.0
  focal_gamma: 0.0
  label_smoothing: 0.01
  pos_weight_max: 20.0
  aux_weight: 0.3                      # per-series auxiliary supervision
  distil_weight: 0.0                   # raise to ~1.0 after training the teacher
  distil_temperature: 2.0
  channels_last: true
  compile: false
  early_stop_patience: 4
  metric_name: macro_auc               # set to the official metric once confirmed

text:
  model_name: xlm-roberta-base
  max_length: 320
  epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  text_column: null

inference:
  batch_size: 4
  tta_hflip: false
  tta_slice_shift: true
  use_ema: true
  half: true
