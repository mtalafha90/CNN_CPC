[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsnaknee"
version = "0.1.0"
description = "Multi-label knee MRI abnormality detection for the RSNA 2026 challenge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pydicom>=2.4",
  "opencv-python-headless>=4.8",
  "torch>=2.1",
  "timm>=0.9.12",
]

[project.optional-dependencies]
text = ["transformers>=4.38", "tokenizers>=0.15", "sentencepiece>=0.1.99"]
dev = ["pytest>=7.4", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["rsnaknee*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
