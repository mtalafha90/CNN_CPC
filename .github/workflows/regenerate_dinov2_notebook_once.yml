name: regenerate-dinov2-notebook-once

on:
  push:
    branches:
      - tmp-dinov2-notebook-sync
    paths:
      - .github/workflows/regenerate_dinov2_notebook_once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-dinov2-notebook-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate notebook from checked-in builder
        run: python notebook/build_dinov2_local_notebook.py
      - name: Commit generated notebook
        run: |
          if git diff --quiet -- notebook/dinov2_knee_mri_local.ipynb; then
            echo "Notebook already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook/dinov2_knee_mri_local.ipynb
          git commit -m "Regenerate DINOv2 notebook with RTX 5090 loader settings"
          git push origin HEAD:tmp-dinov2-notebook-sync
