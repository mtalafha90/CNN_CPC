name: current-model-tests

on:
  push:
  pull_request:

jobs:
  test-current-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile clean interface and archived implementation
        run: |
          python -m compileall -q model data training validation testing developments/src
      - name: Run current-model safety tests
        env:
          PYTHONPATH: developments/src
        run: |
          pytest -q \
            developments/tests/test_b20_crop_focus.py \
            developments/tests/test_supervision_balance.py \
            developments/tests/test_b27_pathology_routing.py \
            developments/tests/test_b27_1_pathology_routing.py \
            developments/tests/test_b28_max_evidence_residual.py \
            developments/tests/test_b29_complementary_series_pool.py \
            developments/tests/test_b30_projected_complementary_series_pool.py \
            developments/tests/test_b31_local_context_complementary_pool.py \
            developments/tests/test_b32_dispersion_complementary_pool.py \
            developments/tests/test_b33_uniform_complementary_mean.py \
            developments/tests/test_b34_training_only_context_scaffold.py \
            developments/tests/test_b35_exact_batch.py \
            developments/tests/test_b35_target_spatial_residual.py \
            developments/tests/test_b36_sparse_mil.py \
            developments/tests/test_b37_highres.py \
            developments/tests/test_b37_highres_sparse_mil.py \
            developments/tests/test_prospective_weak_v1.py \
            developments/tests/test_pv1_b31_context_counterfactual.py \
            developments/tests/test_prospective_weak_v2.py \
            developments/tests/test_dataset_contract_audit.py \
            developments/tests/test_dataset_header_audit.py \
            developments/tests/test_dataset_domain_intersection_audit.py \
            developments/tests/test_report_supervision_gap_audit.py \
            developments/tests/test_report_translation_rescue_pilot.py \
            developments/tests/test_report_translation_rescue_full.py \
            developments/tests/test_translation_rescue_supervision_merge.py \
            developments/tests/test_phase9_supervision.py \
            developments/tests/test_phase9_v2_supervision.py \
            developments/tests/test_phase9_v2_target_analysis.py \
            tools/tests/test_organize_runs.py \
            tools/tests/test_migrate_runs.py
